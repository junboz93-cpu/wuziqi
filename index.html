<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋 - Gomoku</title>
<style>
  :root { color-scheme: light; }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "KaiTi", "楷体", "STKaiti", "Noto Serif SC", serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #2c1810;
    background-image:
      radial-gradient(ellipse at 50% 0%, rgba(139, 90, 43, 0.4) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(139, 90, 43, 0.15) 0%, transparent 50%);
    user-select: none;
  }

  .container {
    display: flex;
    gap: 40px;
    align-items: center;
    padding: 30px;
    background: linear-gradient(135deg, #d4a76a 0%, #c4944a 30%, #b8833a 60%, #d4a76a 100%);
    border-radius: 16px;
    box-shadow:
      0 12px 40px rgba(0,0,0,0.5),
      inset 0 2px 4px rgba(255,255,255,0.2),
      inset 0 -4px 8px rgba(0,0,0,0.15);
    border: 8px solid #5c3317;
  }

  .board-wrapper {
    position: relative;
    padding: 20px;
    background: linear-gradient(135deg, #e8c97a 0%, #dbb85e 50%, #c9a44a 100%);
    border-radius: 8px;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,0.15),
      0 4px 12px rgba(0,0,0,0.3);
    border: 3px solid #8b5e3c;
  }

  .board-top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .undo-hint {
    font-size: 13px;
    color: #5c3317;
    letter-spacing: 1px;
  }

  .undo-hint strong {
    font-size: 16px;
    color: #c0392b;
  }

  .btn-undo-top {
    font-family: "KaiTi", "楷体", "STKaiti", serif;
    font-size: 13px;
    padding: 5px 14px;
    border: 1px solid #8b5e3c;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
    font-weight: bold;
    background: linear-gradient(180deg, #f5e6c8 0%, #e0cfa0 100%);
    color: #5c3317;
    transition: all 0.2s;
  }

  .btn-undo-top:hover:not(:disabled) {
    background: linear-gradient(180deg, #fff0d8 0%, #e8d5a8 100%);
    transform: translateY(-1px);
  }

  .btn-undo-top:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none;
  }

  canvas {
    display: block;
    border-radius: 4px;
    cursor: pointer;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 20px;
    min-width: 180px;
  }

  .panel-card {
    background: linear-gradient(180deg, #f5e6c8 0%, #e8d5a8 100%);
    border: 2px solid #8b5e3c;
    border-radius: 10px;
    padding: 16px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .panel-card h3 {
    font-size: 15px;
    color: #5c3317;
    text-align: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid #c9a44a;
    letter-spacing: 2px;
  }

  .color-pick {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .color-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }

  .color-btn.black { background: radial-gradient(circle at 40% 40%, #555, #111); }
  .color-btn.white {
    background: radial-gradient(circle at 40% 40%, #fff, #ddd);
    border-color: #aaa;
  }

  .color-btn:hover { transform: scale(1.1); }
  .color-btn.selected {
    border-color: #c0392b;
    box-shadow: 0 0 0 3px rgba(192,57,43,0.4);
  }

  .color-btn.selected::after {
    content: "✓";
    position: absolute;
    bottom: -4px;
    right: -4px;
    font-size: 14px;
    font-weight: bold;
    color: #c0392b;
    line-height: 1;
  }

  .status-text {
    font-size: 17px;
    font-weight: bold;
    color: #3e1f0d;
    text-align: center;
    padding: 8px 0;
    letter-spacing: 2px;
  }

  .score-row {
    display: flex;
    justify-content: space-around;
    align-items: center;
    font-size: 14px;
    color: #5c3317;
    padding: 4px 0;
  }

  .score-num {
    font-size: 22px;
    font-weight: bold;
    color: #3e1f0d;
  }

  .actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    font-family: "KaiTi", "楷体", "STKaiti", serif;
    font-size: 15px;
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    font-weight: bold;
  }

  .btn-primary {
    background: linear-gradient(180deg, #8b5e3c 0%, #5c3317 100%);
    color: #f5e6c8;
    border: 1px solid #3e1f0d;
  }

  .btn-primary:hover {
    background: linear-gradient(180deg, #9b6e4c 0%, #6c4327 100%);
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
  }

  .btn-secondary {
    background: linear-gradient(180deg, #f5e6c8 0%, #e0cfa0 100%);
    color: #5c3317;
    border: 1px solid #c9a44a;
  }

  .btn-secondary:hover {
    background: linear-gradient(180deg, #fff0d8 0%, #e8d5a8 100%);
  }

  .btn-warn {
    background: linear-gradient(180deg, #c0392b 0%, #a93226 100%);
    color: #fff;
    border: 1px solid #8b0000;
  }

  .btn-warn:hover { filter: brightness(1.1); }

  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .last-move-dot {
    fill: #c0392b;
  }

  @media (max-width: 768px) {
    .container { flex-direction: column; gap: 20px; padding: 20px; }
    .side-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; min-width: auto; }
    .panel-card { min-width: 130px; }
  }
</style>
</head>
<body>

<div class="container">
  <div class="board-wrapper">
    <div class="board-top-bar">
      <span class="undo-hint">可悔棋 <strong id="undoRemain">2</strong> 步</span>
      <button class="btn btn-undo-top" id="btnUndoTop">↩ 悔棋</button>
    </div>
    <canvas id="board" width="590" height="590"></canvas>
  </div>

  <div class="side-panel">
    <div class="panel-card">
      <h3>选择棋子</h3>
      <div class="color-pick">
        <button class="color-btn black selected" id="pickBlack" title="执黑先手"></button>
        <button class="color-btn white" id="pickWhite" title="执白后手"></button>
      </div>
    </div>

    <div class="panel-card">
      <h3>当前状态</h3>
      <div class="status-text" id="statusText">你的回合</div>
    </div>

    <div class="panel-card">
      <h3>比分</h3>
      <div class="score-row">
        <span>⚫ 黑方</span>
        <span class="score-num" id="blackScore">0</span>
      </div>
      <div class="score-row">
        <span>⚪ 白方</span>
        <span class="score-num" id="whiteScore">0</span>
      </div>
      <div class="score-row">
        <span>🤝 平局</span>
        <span class="score-num" id="drawScore">0</span>
      </div>
    </div>

    <div class="panel-card actions">
      <button class="btn btn-primary" id="btnRestart">重新开始</button>
      <button class="btn btn-secondary" id="btnUndo">悔棋</button>
      <button class="btn btn-warn" id="btnReset">重置比分</button>
    </div>
  </div>
</div>

<script>
// ────────── Gomoku Game Engine ──────────
const BOARD_SIZE = 15;
const CELL = 36;
const PADDING = 28;
const LABEL_SIZE = 18; // margin for row/col labels
const RADIUS = 15;
const BOARD_OX = PADDING + LABEL_SIZE; // grid origin X
const BOARD_OY = PADDING + LABEL_SIZE; // grid origin Y
const CANVAS_W = BOARD_OX + (BOARD_SIZE - 1) * CELL + PADDING;
const CANVAS_H = BOARD_OY + (BOARD_SIZE - 1) * CELL + PADDING;

const EMPTY = 0, BLACK = 1, WHITE = 2;

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

let board = [];
let currentPlayer = BLACK;
let playerColor = BLACK;
let aiColor = WHITE;
let gameOver = false;
let winner = null;
let moveHistory = [];
let scores = { black: 0, white: 0, draw: 0 };
let aiThinking = false;
let undoCount = 0;
const MAX_UNDO = 2;
let aiStartTime = 0;
const AI_MAX_TIME = 8000; // 8 second cap

// ────────── Init ──────────
function initBoard() {
  board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(EMPTY));
  currentPlayer = BLACK;
  gameOver = false;
  winner = null;
  moveHistory = [];
  aiThinking = false;
  undoCount = 0;
  updateUndoUI();
  updateStatus();
  drawBoard();
}

function updateStatus() {
  const st = document.getElementById('statusText');
  if (gameOver) {
    if (winner === playerColor) st.textContent = '你赢了！🎉';
    else if (winner === aiColor) st.textContent = 'AI 赢了';
    else st.textContent = '平局';
  } else if (currentPlayer === playerColor) {
    st.textContent = '你的回合';
  } else {
    st.textContent = 'AI 思考中...';
  }
}

function updateUndoUI() {
  const remain = MAX_UNDO - undoCount;
  document.getElementById('undoRemain').textContent = remain;
  const disabled = gameOver || aiThinking || moveHistory.length < 2 || undoCount >= MAX_UNDO;
  document.getElementById('btnUndo').disabled = disabled;
  document.getElementById('btnUndoTop').disabled = disabled;
}

// ────────── Draw ──────────
function drawBoard() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

  // Board background
  ctx.fillStyle = '#e8c97a';
  ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

  // Grain texture
  ctx.globalAlpha = 0.06;
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * CANVAS_W, y = Math.random() * CANVAS_H;
    ctx.fillStyle = Math.random() > 0.5 ? '#000' : '#fff';
    ctx.fillRect(x, y, Math.random() * 30 + 2, 1);
  }
  ctx.globalAlpha = 1;

  // ── Row & Column labels ──
  ctx.font = 'bold 11px "KaiTi", "楷体", "STKaiti", serif';
  ctx.fillStyle = '#5c3317';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Column labels (A-O at top)
  const colLabels = 'ABCDEFGHIJKLMNO';
  for (let i = 0; i < BOARD_SIZE; i++) {
    const x = BOARD_OX + i * CELL;
    ctx.fillText(colLabels[i], x, PADDING + 8);
  }

  // Row labels (1-15 on left)
  ctx.textAlign = 'right';
  for (let i = 0; i < BOARD_SIZE; i++) {
    const y = BOARD_OY + i * CELL;
    ctx.fillText(String(i + 1), BOARD_OX - 8, y);
  }

  // Grid lines
  ctx.strokeStyle = '#5c3317';
  ctx.lineWidth = 1;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const pos = BOARD_OY + i * CELL;
    ctx.beginPath();
    ctx.moveTo(BOARD_OX, pos);
    ctx.lineTo(BOARD_OX + (BOARD_SIZE - 1) * CELL, pos);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(BOARD_OX + i * CELL, BOARD_OY);
    ctx.lineTo(BOARD_OX + i * CELL, BOARD_OY + (BOARD_SIZE - 1) * CELL);
    ctx.stroke();
  }

  // Star points (天元 and corners)
  const stars = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
  for (const [r, c] of stars) {
    ctx.fillStyle = '#5c3317';
    ctx.beginPath();
    ctx.arc(BOARD_OX + c * CELL, BOARD_OY + r * CELL, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Stones
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c < BOARD_SIZE; c++) {
      if (board[r][c] === EMPTY) continue;
      const x = BOARD_OX + c * CELL;
      const y = BOARD_OY + r * CELL;

      ctx.save();
      // Shadow
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;

      if (board[r][c] === BLACK) {
        const grad = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, RADIUS);
        grad.addColorStop(0, '#555');
        grad.addColorStop(0.6, '#1a1a1a');
        grad.addColorStop(1, '#000');
        ctx.fillStyle = grad;
      } else {
        const grad = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, RADIUS);
        grad.addColorStop(0, '#fff');
        grad.addColorStop(0.6, '#e8e8e8');
        grad.addColorStop(1, '#bbb');
        ctx.fillStyle = grad;
      }

      ctx.beginPath();
      ctx.arc(x, y, RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // Last move indicator
  if (moveHistory.length > 0) {
    const [lr, lc] = moveHistory[moveHistory.length - 1];
    const x = BOARD_OX + lc * CELL;
    const y = BOARD_OY + lr * CELL;
    ctx.fillStyle = board[lr][lc] === BLACK ? '#e74c3c' : '#c0392b';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ────────── Game Logic ──────────
function isValidMove(r, c) {
  return r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE && board[r][c] === EMPTY;
}

function placeStone(r, c, player) {
  board[r][c] = player;
  moveHistory.push([r, c]);
}

function undoMove() {
  if (moveHistory.length === 0) return;
  const [r, c] = moveHistory.pop();
  board[r][c] = EMPTY;
}

function checkWin(r, c, player) {
  const directions = [[0,1],[1,0],[1,1],[1,-1]];

  for (const [dr, dc] of directions) {
    let count = 1;
    for (let i = 1; i < 5; i++) {
      const nr = r + dr * i, nc = c + dc * i;
      if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) count++;
      else break;
    }
    for (let i = 1; i < 5; i++) {
      const nr = r - dr * i, nc = c - dc * i;
      if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === player) count++;
      else break;
    }
    if (count >= 5) return true;
  }
  return false;
}

function isBoardFull() {
  for (let r = 0; r < BOARD_SIZE; r++)
    for (let c = 0; c < BOARD_SIZE; c++)
      if (board[r][c] === EMPTY) return false;
  return true;
}

function endGame(winningPlayer) {
  gameOver = true;
  if (winningPlayer === null) {
    winner = null;
    scores.draw++;
    document.getElementById('drawScore').textContent = scores.draw;
    return;
  }
  winner = winningPlayer;
  if (winningPlayer === BLACK) {
    scores.black++;
    document.getElementById('blackScore').textContent = scores.black;
  } else {
    scores.white++;
    document.getElementById('whiteScore').textContent = scores.white;
  }
}

function switchPlayer() {
  currentPlayer = currentPlayer === BLACK ? WHITE : BLACK;
}

// ────────── AI (Alpha-Beta Minimax + Line Scan Eval) ──────────

// Directions: horizontal, vertical, diag, anti-diag
const DIRS = [[0,1],[1,0],[1,1],[1,-1]];

// Pattern shape scores per 5-cell window (selfCount, opponentCount, emptyCount) → score
function windowScore(me, op, empty, hasBlockLeft, hasBlockRight) {
  const blocks = (hasBlockLeft ? 1 : 0) + (hasBlockRight ? 1 : 0);
  if (me === 5) return 10000000;
  if (op === 5) return -10000000;
  if (me === 4) {
    if (empty === 1 && blocks === 0) return 500000;  // open four
    if (empty === 1 && blocks === 1) return 50000;   // four
  }
  if (op === 4) {
    if (empty === 1 && blocks === 0) return -500000; // opponent open four
    if (empty === 1 && blocks === 1) return -50000;
  }
  if (me === 3) {
    if (empty === 2 && blocks === 0) return 50000;    // open three
    if (empty === 2 && blocks <= 1) return 2000;      // three
  }
  if (op === 3) {
    if (empty === 2 && blocks === 0) return -50000;
    if (empty === 2 && blocks <= 1) return -2000;
  }
  if (me === 2) {
    if (empty === 3 && blocks === 0) return 500;       // open two
    if (empty === 3 && blocks <= 1) return 100;        // two
  }
  if (op === 2) {
    if (empty === 3 && blocks === 0) return -500;
    if (empty === 3 && blocks <= 1) return -100;
  }
  if (me === 1) {
    if (empty === 4 && blocks === 0) return 30;        // open one
  }
  if (op === 1) {
    if (empty === 4 && blocks === 0) return -30;
  }
  return 0;
}

// Fast full-board evaluation by sliding 5-cell window
function evaluateBoardFast(aiPlayer) {
  let score = 0;
  const opponent = aiPlayer === BLACK ? WHITE : BLACK;

  // Horizontal
  for (let r = 0; r < BOARD_SIZE; r++) {
    for (let c = 0; c <= BOARD_SIZE - 5; c++) {
      let me = 0, op = 0, empty = 0;
      for (let k = 0; k < 5; k++) {
        const v = board[r][c + k];
        if (v === aiPlayer) me++;
        else if (v === opponent) op++;
        else empty++;
      }
      if (me > 0 && op > 0) continue; // mixed window, dead
      const leftBlock = (c > 0 && board[r][c - 1] !== EMPTY && board[r][c - 1] !== (me > 0 ? aiPlayer : opponent));
      const rightBlock = (c + 5 < BOARD_SIZE && board[r][c + 5] !== EMPTY && board[r][c + 5] !== (me > 0 ? aiPlayer : opponent));
      score += windowScore(me, op, empty, leftBlock, rightBlock);
    }
  }

  // Vertical
  for (let c = 0; c < BOARD_SIZE; c++) {
    for (let r = 0; r <= BOARD_SIZE - 5; r++) {
      let me = 0, op = 0, empty = 0;
      for (let k = 0; k < 5; k++) {
        const v = board[r + k][c];
        if (v === aiPlayer) me++;
        else if (v === opponent) op++;
        else empty++;
      }
      if (me > 0 && op > 0) continue;
      const leftBlock = (r > 0 && board[r - 1][c] !== EMPTY && board[r - 1][c] !== (me > 0 ? aiPlayer : opponent));
      const rightBlock = (r + 5 < BOARD_SIZE && board[r + 5][c] !== EMPTY && board[r + 5][c] !== (me > 0 ? aiPlayer : opponent));
      score += windowScore(me, op, empty, leftBlock, rightBlock);
    }
  }

  // Diagonal (top-left to bottom-right)
  for (let r = 0; r <= BOARD_SIZE - 5; r++) {
    for (let c = 0; c <= BOARD_SIZE - 5; c++) {
      let me = 0, op = 0, empty = 0;
      for (let k = 0; k < 5; k++) {
        const v = board[r + k][c + k];
        if (v === aiPlayer) me++;
        else if (v === opponent) op++;
        else empty++;
      }
      if (me > 0 && op > 0) continue;
      const leftBlock = (r > 0 && c > 0 && board[r - 1][c - 1] !== EMPTY && board[r - 1][c - 1] !== (me > 0 ? aiPlayer : opponent));
      const rightBlock = (r + 5 < BOARD_SIZE && c + 5 < BOARD_SIZE && board[r + 5][c + 5] !== EMPTY && board[r + 5][c + 5] !== (me > 0 ? aiPlayer : opponent));
      score += windowScore(me, op, empty, leftBlock, rightBlock);
    }
  }

  // Anti-diagonal (top-right to bottom-left)
  for (let r = 0; r <= BOARD_SIZE - 5; r++) {
    for (let c = 4; c < BOARD_SIZE; c++) {
      let me = 0, op = 0, empty = 0;
      for (let k = 0; k < 5; k++) {
        const v = board[r + k][c - k];
        if (v === aiPlayer) me++;
        else if (v === opponent) op++;
        else empty++;
      }
      if (me > 0 && op > 0) continue;
      const leftBlock = (r > 0 && c < BOARD_SIZE - 1 && board[r - 1][c + 1] !== EMPTY && board[r - 1][c + 1] !== (me > 0 ? aiPlayer : opponent));
      const rightBlock = (r + 5 < BOARD_SIZE && c - 5 >= 0 && board[r + 5][c - 5] !== EMPTY && board[r + 5][c - 5] !== (me > 0 ? aiPlayer : opponent));
      score += windowScore(me, op, empty, leftBlock, rightBlock);
    }
  }

  return score;
}

function getCandidateMoves() {
  const candidates = [];
  const visited = new Set();

  for (const [r, c] of moveHistory) {
    for (let dr = -2; dr <= 2; dr++) {
      for (let dc = -2; dc <= 2; dc++) {
        const nr = r + dr, nc = c + dc;
        const key = nr * BOARD_SIZE + nc;
        if (!visited.has(key) && isValidMove(nr, nc)) {
          visited.add(key);
          candidates.push([nr, nc]);
        }
      }
    }
  }

  if (candidates.length === 0) {
    const mid = Math.floor(BOARD_SIZE / 2);
    candidates.push([mid, mid]);
    candidates.push([mid - 1, mid - 1]);
    candidates.push([mid + 1, mid + 1]);
    candidates.push([mid, mid - 1]);
    candidates.push([mid, mid + 1]);
  }

  // Sort by immediate pattern score for better pruning
  candidates.sort((a, b) => {
    const sa = quickScore(a[0], a[1]);
    const sb = quickScore(b[0], b[1]);
    return sb - sa;
  });

  return candidates.slice(0, 25);
}

function quickScore(r, c) {
  board[r][c] = aiColor;
  const sa = evaluateBoardFast(aiColor);
  board[r][c] = EMPTY;
  board[r][c] = playerColor;
  const sb = evaluateBoardFast(aiColor);
  board[r][c] = EMPTY;
  return sa + sb * 0.5; // defensive consideration built in
}

function minimax(depth, alpha, beta, isMaximizing, lastR, lastC) {
  // Check if last placed stone won
  if (lastR !== undefined && lastC !== undefined && checkWin(lastR, lastC, board[lastR][lastC])) {
    return board[lastR][lastC] === aiColor ? 100000000 + depth : -(100000000 + depth);
  }
  if (isBoardFull()) return 0;
  if (depth === 0) return evaluateBoardFast(aiColor);

  let candidates = getCandidateMoves();
  // At deeper levels, use fewer candidates for speed
